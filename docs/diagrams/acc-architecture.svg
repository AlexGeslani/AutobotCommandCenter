<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Autobot Command Center Matrix architecture</title>
  <desc id="desc">Authorized and bounded evidence sources enter strict validators. Versioned sanitized projections feed one read-only React core and two delivery surfaces. Invalid candidates fail closed and mutable runtime data remains outside Git.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#063b1d" stroke-width="0.7"/>
      <circle cx="1" cy="1" r="1" fill="#0b5f2c"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39ff88"/>
    </marker>
    <marker id="warn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b7ff3c"/>
    </marker>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8ffe5}.title{font-size:31px;font-weight:800;fill:#f0fff4}.subtitle{font-size:13px;fill:#73d99a}.section{font-size:12px;font-weight:800;letter-spacing:2px;fill:#39ff88}.name{font-size:16px;font-weight:800;fill:#effff4}.copy{font-size:11px;fill:#a0e7b8}.tiny{font-size:10px;fill:#69bd87}.pill{font-size:9px;font-weight:800;letter-spacing:1px;fill:#39ff88}.box{fill:#001409;stroke:#19c965;stroke-width:1.5}.box-strong{fill:#001d0c;stroke:#39ff88;stroke-width:1.8}.box-warn{fill:#172100;stroke:#b7ff3c;stroke-width:1.6}.boundary{fill:#000b05;fill-opacity:.86;stroke:#118743;stroke-width:1.5;stroke-dasharray:9 6}.flow{fill:none;stroke:#39ff88;stroke-width:2}.flow-muted{fill:none;stroke:#15934c;stroke-width:1.8}.flow-warn{fill:none;stroke:#b7ff3c;stroke-width:2;stroke-dasharray:7 6}.card{fill:#001008;stroke:#126331;stroke-width:1}.legend{font-size:10px;fill:#a0e7b8}
    </style>
  </defs>

  <rect width="1440" height="900" fill="#000503"/>
  <rect width="1440" height="900" fill="url(#grid)" opacity=".78"/>
  <circle cx="58" cy="54" r="6" fill="#39ff88" filter="url(#glow)"/>
  <text x="80" y="64" class="title">Autobot Command Center</text>
  <text x="80" y="89" class="subtitle">Matrix architecture · read-only evidence projection · fail-closed by design</text>

  <!-- Flows are intentionally behind the component boxes. -->
  <path d="M324 226H442" class="flow" marker-end="url(#arrow)"/>
  <path d="M324 348H442" class="flow" marker-end="url(#arrow)"/>
  <path d="M324 470H442" class="flow" marker-end="url(#arrow)"/>
  <path d="M324 592H442" class="flow-warn" marker-end="url(#warn-arrow)"/>
  <path d="M742 396H818" class="flow" marker-end="url(#arrow)"/>
  <path d="M1174 314H1250V232" class="flow-muted" marker-end="url(#arrow)"/>
  <path d="M1174 490H1250V592" class="flow-muted" marker-end="url(#arrow)"/>
  <path d="M592 654V736" class="flow-warn" marker-end="url(#warn-arrow)"/>
  <path d="M1000 650V736" class="flow-muted" marker-end="url(#arrow)"/>

  <text x="72" y="144" class="section">01 · AUTHORIZED SOURCES</text>
  <rect x="64" y="166" width="270" height="108" rx="8" class="box"/>
  <text x="86" y="198" class="name">Web analytics</text>
  <text x="86" y="223" class="copy">Dated edge aggregates</text>
  <text x="86" y="244" class="copy">Coverage · checksums · provenance</text>
  <text x="86" y="263" class="pill">NO RAW REQUEST LOGS</text>

  <rect x="64" y="288" width="270" height="108" rx="8" class="box"/>
  <text x="86" y="320" class="name">Portfolio evidence</text>
  <text x="86" y="345" class="copy">Allowlisted project metadata</text>
  <text x="86" y="366" class="copy">Dated outcomes · limitations</text>
  <text x="86" y="385" class="pill">BOUNDED RESUME PROJECTION</text>

  <rect x="64" y="410" width="270" height="108" rx="8" class="box"/>
  <text x="86" y="442" class="name">Benchmark artifacts</text>
  <text x="86" y="467" class="copy">Frozen releases · exact conditions</text>
  <text x="86" y="488" class="copy">Denominators · immutable run lineage</text>
  <text x="86" y="507" class="pill">PENDING SCORES WITHHELD</text>

  <rect x="64" y="532" width="270" height="108" rx="8" class="box-warn"/>
  <text x="86" y="564" class="name">Protected knowledge</text>
  <text x="86" y="589" class="copy">Optional server-side search bridge</text>
  <text x="86" y="610" class="copy">Bounded scope · source-linked results</text>
  <text x="86" y="629" class="pill" fill="#b7ff3c">CREDENTIALS NEVER REACH UI</text>

  <rect x="432" y="150" width="320" height="520" rx="14" class="boundary"/>
  <text x="458" y="184" class="section">02 · PROJECTION AUTHORITY</text>
  <rect x="458" y="206" width="268" height="120" rx="8" class="box-strong"/>
  <text x="480" y="238" class="name">Closed validation</text>
  <text x="480" y="263" class="copy">Versioned schemas · known identities</text>
  <text x="480" y="284" class="copy">Authority · freshness · safe fields</text>
  <text x="480" y="306" class="pill">REJECT UNKNOWN INPUT</text>

  <rect x="458" y="346" width="268" height="120" rx="8" class="box-strong"/>
  <text x="480" y="378" class="name">Atomic publication</text>
  <text x="480" y="403" class="copy">Validate the complete candidate</text>
  <text x="480" y="424" class="copy">Then replace every destination</text>
  <text x="480" y="446" class="pill">ALL NEW OR LAST-GOOD</text>

  <rect x="458" y="486" width="268" height="156" rx="8" class="box-warn"/>
  <text x="480" y="518" class="name">Fail-closed state</text>
  <text x="480" y="543" class="copy">Invalid is not empty or zero</text>
  <text x="480" y="564" class="copy">Stale and missing remain explicit</text>
  <text x="480" y="585" class="copy">Dependent claims are withheld</text>
  <text x="480" y="606" class="copy">Mutable source bytes remain untracked</text>
  <text x="480" y="629" class="pill" fill="#b7ff3c">NO INVENTED HEALTH</text>

  <rect x="808" y="150" width="376" height="520" rx="14" class="boundary"/>
  <text x="834" y="184" class="section">03 · READ-ONLY APPLICATION</text>
  <rect x="834" y="206" width="324" height="104" rx="8" class="box"/>
  <text x="856" y="238" class="name">Edition contract</text>
  <text x="856" y="263" class="copy">Branding · modules · stable IDs</text>
  <text x="856" y="286" class="pill">IMMUTABLE JSON · NO UI CODE</text>

  <rect x="834" y="330" width="324" height="170" rx="8" class="box-strong"/>
  <text x="856" y="363" class="name">React Core</text>
  <text x="856" y="389" class="copy">Portfolio · Analytics · Benchmarks</text>
  <text x="856" y="410" class="copy">Search · sorting · responsive detail</text>
  <text x="856" y="431" class="copy">One routing and trust model</text>
  <text x="856" y="452" class="copy">No upstream mutation controls</text>
  <text x="856" y="480" class="pill">SAME CORE · SAME SEMANTICS</text>

  <rect x="834" y="520" width="324" height="122" rx="8" class="box"/>
  <text x="856" y="552" class="name">Matrix presentation</text>
  <text x="856" y="577" class="copy">Local theme preference only</text>
  <text x="856" y="598" class="copy">Status meaning stays invariant</text>
  <text x="856" y="621" class="pill">EVIDENCE NEVER CHANGES WITH THEME</text>

  <text x="1212" y="144" class="section">04 · SURFACES</text>
  <rect x="1210" y="166" width="184" height="120" rx="8" class="box-strong"/>
  <text x="1232" y="199" class="name">Hermes plugin</text>
  <text x="1232" y="224" class="copy">Embedded dashboard</text>
  <text x="1232" y="245" class="copy">Same validated core</text>
  <text x="1232" y="266" class="pill">READ ONLY</text>

  <rect x="1210" y="532" width="184" height="120" rx="8" class="box-strong"/>
  <text x="1232" y="565" class="name">Standalone</text>
  <text x="1232" y="590" class="copy">Static review SPA</text>
  <text x="1232" y="611" class="copy">Same validated core</text>
  <text x="1232" y="632" class="pill">PORTABLE</text>

  <rect x="64" y="724" width="1330" height="116" rx="12" class="boundary"/>
  <text x="88" y="756" class="section">GIT / RUNTIME SEPARATION</text>
  <rect x="88" y="776" width="606" height="42" rx="7" class="card"/>
  <circle cx="110" cy="797" r="5" fill="#39ff88"/>
  <text x="126" y="801" class="legend">TRACKED · Core · contracts · tests · sanitized fixtures · built surfaces</text>
  <rect x="716" y="776" width="654" height="42" rx="7" class="card"/>
  <circle cx="738" cy="797" r="5" fill="#b7ff3c"/>
  <text x="754" y="801" class="legend">UNTRACKED RUNTIME · Current projections · bindings · credentials · raw responses</text>

  <text x="64" y="878" class="tiny">Evidence remains authoritative at its source. Autobot Command Center validates and projects; it never mutates the systems it observes.</text>
</svg>
